name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Static PowerShell checks
        shell: powershell
        run: .\tests\StaticChecks.ps1
      - name: Build embedded Windows launcher
        shell: powershell
        run: .\build\build-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ChatAttachmentManager-win-x64
          path: |
            dist/ChatAttachmentManager.exe
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ChatAttachmentManager.exe dist/SHA256SUMS.txt --generate-notes --title "Chat Attachment Manager ${{ github.ref_name }}"
